name: SeaQA AI Test CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*requirements.txt"
      - run: pip install -r test-requirements.txt
      - run: pytest -m "not llm"
  llm:
    needs: unit
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_LLM_TESTS: "1"
      LLM_MODELS: ${{ secrets.SEAQA_AI_TEST_LLM_MODELS }}
      SEAQA_TEST_MODEL: ${{ vars.SEAQA_AI_TEST_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "*requirements.txt"
      - run: pip install -r test-requirements.txt
      - run: pytest -m llm -s --junitxml=llm-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-runs
          path: |
            tests/agent/_runs
            llm-report.xml
